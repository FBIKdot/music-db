name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Build
        run: deno task build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/music-db.exe
